name: Generate Swift Book PDFs

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Optional specific commit SHA of swift-book to build from'
        required: false
  schedule:
    - cron: '18 0 * * *'  # Every day at 00:18 UTC

concurrency:
  group: swift-book-archive
  cancel-in-progress: false

jobs:
  generate-pdfs:
    runs-on: macos-latest
    outputs:
      matrix: ${{ steps.missed_tags.outputs.matrix }}
      has_work: ${{ steps.missed_tags.outputs.has_work }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch target commit info
        id: fetch_target
        env:
          INPUT_SHA: ${{ github.event.inputs.sha }}
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$INPUT_SHA" ]; then
            INPUT_SHA_SHORT=$(echo "$INPUT_SHA" | cut -c1-7)
            echo "Using manually provided SHA: $INPUT_SHA_SHORT"
            COMMIT_JSON=$(curl -s -H "Authorization: Bearer $GITHUB_API_TOKEN" \
              "https://api.github.com/repos/swiftlang/swift-book/commits/$INPUT_SHA")
          else
            echo "Fetching latest commit from main..."
            COMMIT_JSON=$(curl -s -H "Authorization: Bearer $GITHUB_API_TOKEN" \
              "https://api.github.com/repos/swiftlang/swift-book/commits?sha=main&per_page=1")
            COMMIT_JSON=$(echo "$COMMIT_JSON" | jq '.[0]')
          fi

          LATEST_SHA=$(echo "$COMMIT_JSON" | jq -r '.sha')
          LATEST_SHA_SHORT=$(echo "$LATEST_SHA" | cut -c1-7)

          echo "LATEST_SHA=$LATEST_SHA" >> $GITHUB_ENV
          echo "LATEST_SHA_SHORT=$LATEST_SHA_SHORT" >> $GITHUB_ENV
          echo "latest_sha=$LATEST_SHA" >> $GITHUB_OUTPUT

      - name: Clone swift-book repo
        run: |
          git clone https://github.com/swiftlang/swift-book.git swift-book-repo
          cd swift-book-repo
          git fetch --tags

      - name: Find missing release tags and latest build
        id: missed_tags
        run: |
          MATRIX=$(python3 .github/automation/scripts/update-release-manifest.py --build-matrix \
            --upstream-repo swift-book-repo --sha "$LATEST_SHA")
          echo "$MATRIX" | jq .
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "has_work=$(echo "$MATRIX" | jq '.include | length > 0')" >> "$GITHUB_OUTPUT"

  build-pdfs:
    needs: generate-pdfs
    runs-on: macos-latest
    if: needs.generate-pdfs.outputs.has_work == 'true'
    strategy:
      matrix: ${{ fromJson(needs.generate-pdfs.outputs.matrix) }}
      max-parallel: 1
    env:
      BOOK_DIR: archive/${{ matrix.path }}
      SOURCE_TAG: ${{ matrix.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update main branch and tags
        run: git checkout main && git pull --tags origin main

      - name: Download swift-book repo at commit
        env:
          SHA: ${{ matrix.sha }}
        run: |
          git clone https://github.com/swiftlang/swift-book.git swift-book-repo
          cd swift-book-repo
          git checkout --detach "$SHA"

      - name: Read build metadata
        run: |
          LATEST_SHA=$(git -C swift-book-repo rev-parse HEAD)
          LATEST_SHA_SHORT=$(echo "$LATEST_SHA" | cut -c1-7)
          echo "LATEST_SHA=$LATEST_SHA" >> "$GITHUB_ENV"
          echo "LATEST_SHA_SHORT=$LATEST_SHA_SHORT" >> "$GITHUB_ENV"
          echo "LATEST_MSG<<EOF" >> "$GITHUB_ENV"
          git -C swift-book-repo show -s --format=%B HEAD >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Download SF Pro Fonts DMG
        run: curl -L -o SF-Pro.dmg https://developer.apple.com/download/files/SF-Pro.dmg

      - name: Mount DMG and install SF Pro fonts
        run: |
          # Mount the DMG
          hdiutil attach SF-Pro.dmg -mountpoint /Volumes/SFPro

          # Install the SF Pro Fonts package system-wide
          sudo installer -pkg "/Volumes/SFPro/SF Pro Fonts.pkg" -target /

          # Detach DMG
          hdiutil detach /Volumes/SFPro

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install swift-book-pdf

      - name: Install TeX Live (cached)
        uses: actions/cache@v4
        with:
          path: |
            ~/texlive
            ~/.texlive2025
          key: texlive-2025-${{ runner.os }}-${{ hashFiles('.github/workflows/generate-swift-book-pdfs.yml') }}
          restore-keys: |
            texlive-2025-${{ runner.os }}-

      - name: Install TeX Live and required packages
        run: |
          set -e
          YEAR=2025
          TEXDIR="$HOME/texlive/${YEAR}"
          export PATH="$TEXDIR/bin/universal-darwin:$PATH"
          if ! command -v tlmgr >/dev/null 2>&1; then
            curl -L -o install-tl-unx.tar.gz http://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz
            tar -xzf install-tl-unx.tar.gz
            INSTALL_DIR=$(find . -maxdepth 1 -type d -name 'install-tl-*' | head -n 1)
            cd "$INSTALL_DIR"
            printf '%s\n' \
              'selected_scheme scheme-small' \
              "TEXDIR $TEXDIR" \
              "TEXMFCONFIG $HOME/.texlive2025/texmf-config" \
              "TEXMFHOME $HOME/texmf" \
              "TEXMFLOCAL $HOME/texlive/texmf-local" \
              "TEXMFSYSCONFIG $TEXDIR/texmf-config" \
              "TEXMFSYSVAR $TEXDIR/texmf-var" \
              "TEXMFVAR $HOME/.texlive2025/texmf-var" \
              'option_doc 0' \
              'option_src 0' \
              > texlive.profile
            ./install-tl -profile texlive.profile
            cd ..
          fi
          tlmgr update --self || true
          REQUIRED_PKGS="fontspec xcolor graphics fancyhdr geometry adjustbox ifoddpage enumitem listings minted tcolorbox pgf needspace hyperref parskip tabulary ragged2e footmisc lua-ul pdfcol tikzfill bigfoot"
          tlmgr install $REQUIRED_PKGS || true
          tlmgr path add
          echo "$TEXDIR/bin/universal-darwin" >> $GITHUB_PATH

      - name: Generate PDFs
        run: |
          mkdir -p "$BOOK_DIR"

          # Helper function to run commands quietly unless debug is enabled
          run_quiet() {
            if [ "$ACTIONS_STEP_DEBUG" = "true" ]; then
              "$@"
            else
              "$@" > /dev/null 2>&1
            fi
          }

          # Generate digital light mode PDF
          echo "Generating digital light mode PDF..."
          run_quiet swift_book_pdf -i ./swift-book-repo "$BOOK_DIR"/swift_book_digital.pdf

          # Generate digital dark mode PDF
          echo "Generating digital dark mode PDF..."
          run_quiet swift_book_pdf -i ./swift-book-repo --dark "$BOOK_DIR"/swift_book_digital_dark.pdf

          # Generate print light mode PDF
          echo "Generating print light mode PDF..."
          run_quiet swift_book_pdf -i ./swift-book-repo --mode print "$BOOK_DIR"/swift_book_print.pdf

          # Generate print dark mode PDF
          echo "Generating print dark mode PDF..."
          run_quiet swift_book_pdf -i ./swift-book-repo --mode print --dark "$BOOK_DIR"/swift_book_print_dark.pdf

          echo "All PDFs generated successfully!"

      - name: Generate EPUB
        run: |
          echo "Generating EPUB..."
          swift-book-epub \
            -e \
            -i ./swift-book-repo \
            --cover-footer-line "Based on the Swift.org source" \
            --publisher "Evangelos Kassos" \
            --contributor "Evangelos Kassos" \
            "$BOOK_DIR"/swift_book.epub

          echo "EPUB generated successfully!"

      - name: Update release manifest
        run: |
          if [ -n "$SOURCE_TAG" ]; then
            python3 .github/automation/scripts/update-release-manifest.py --tag "$SOURCE_TAG" --upstream-repo swift-book-repo
          else
            python3 .github/automation/scripts/update-release-manifest.py --sha "$LATEST_SHA" --upstream-repo swift-book-repo
          fi

      - name: Regenerate README index
        run: python3 .github/automation/scripts/generate-index.py

      - name: Regenerate folder READMEs
        run: python3 .github/automation/scripts/generate-folder-readmes.py

      - name: Commit and push PDFs to repository
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$BOOK_DIR"
          git add archive/README.md archive/*/README.md archive/*/*/README.md || true
          git add .github/automation/releases.json README.md

          # Check if there’s anything staged
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Use the latest commit message and short SHA from swift-book
            # Append a direct link to the upstream commit for convenience
            COMMIT_MSG=$(printf "Swift Book upstream: %s\n%s\n\nUpstream commit: https://github.com/swiftlang/swift-book/commit/%s" "$LATEST_SHA_SHORT" "$LATEST_MSG" "$LATEST_SHA")
            git commit -m "$COMMIT_MSG"
            # Use GitHub token for push
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag commit if upstream is tagged
        if: matrix.tag != ''
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$SOURCE_TAG"; then
            git tag "$SOURCE_TAG"
            git push origin "$SOURCE_TAG"
          fi

      - name: Create release and upload book files if upstream is tagged
        if: matrix.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: ${{ matrix.tag }}
          body: |
            Release for Swift Book upstream tag ${{ matrix.tag }}

            https://github.com/swiftlang/swift-book/releases/tag/${{ matrix.tag }}
          files: |
            archive/${{ matrix.path }}/swift_book_digital.pdf
            archive/${{ matrix.path }}/swift_book_digital_dark.pdf
            archive/${{ matrix.path }}/swift_book_print.pdf
            archive/${{ matrix.path }}/swift_book_print_dark.pdf
            archive/${{ matrix.path }}/swift_book.epub
            archive/${{ matrix.path }}/swift_book_cover.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
